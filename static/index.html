<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Scanner & Enhancer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Document Scanner & Enhancer</h1>
            <p class="subtitle">Upload a document photo to enhance and rectify it using AI</p>
        </header>

        <main>
            <!-- Upload Section -->
            <section class="upload-section">
                <div id="dropzone" class="dropzone">
                    <div class="dropzone-content">
                        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="dropzone-text"><strong>Click to upload</strong> or drag and drop</p>
                        <p class="dropzone-hint">PNG, JPG up to 10MB</p>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>
            </section>

            <!-- Loading Indicator -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Processing your document...</p>
            </div>

            <!-- Results Section -->
            <section id="results" class="results-section hidden">
                <h2>Results</h2>
                <div class="comparison-grid">
                    <div class="image-card">
                        <h3>Raw Photo</h3>
                        <div class="image-container">
                            <img id="rawImage" alt="Raw uploaded photo">
                        </div>
                    </div>
                    <div class="image-card">
                        <h3>Enhanced Scan</h3>
                        <div class="image-container">
                            <img id="enhancedImage" alt="Enhanced document scan">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Error Message -->
            <div id="error" class="error-message hidden"></div>
        </main>

        <footer>
            <p>Powered by Deep Learning • Built with FastAPI & PyTorch</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
